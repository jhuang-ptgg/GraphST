[project]
name = "GraphST"
version = "1.1.2"
description = "Spatially informed clustering, integration, and deconvolution of spatial transcriptomics with GraphST"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Yahui Long", email = "longyh@immunol.a-star.edu.sg" },
]
keywords = [
    "Spatial transcriptomics",
    "Graph self-supervised contrastive learning",
    "Spatial clustering",
    "Cell type deconvolution",
    "Batch correction",
    "Single-cell RNA-seq",
]
dependencies = [
    "requests",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/JinmiaoChenLab/GraphST"

[tool.setuptools]
packages = ["GraphST"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true